<!DOCTYPE html>
<html>
<head>
<style>
th, td {
  border-style: dotted;
}
</style>
</head>
<body>

<h2>Table With Dotted Borders</h2>

<p>Use the CSS border-style property to set the style of the borders.</p>

<table style="width:100%">
  <tr>
    <th>Firstname</th>
    <th>Lastname</th> 
    <th>Age</th>
  </tr>
  <tr>
    <td>Ali</td>
    <td>khan</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Haider</td>
    <td>awan</td>
    <td>94</td>
  </tr>
  <tr>
    <td>malik</td>
    <td>wasi</td>
    <td>80</td>
  </tr>
</table>

</body>
</html>
