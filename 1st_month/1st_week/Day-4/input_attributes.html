<!doctype html>
<html>
  <head>
    <title>Form</title>
  </head>
  <body>
    <form>
      UserName:
      <input type="text" placeholder="Enter your UserName" autofocus />
      <br /><br />
      Password:
      <input
        type="text"
        placeholder="Enter your Password"
        maxlength="4"
        size="4"
      /><br /><br />
      Disabled <br /><br />
      Yes<input type="radio" name="field" /> No<input
        type="radio"
        name="field"
      />
      <input type="text" value="specification" disabled /><br /><br />
      Note:
      <input
        type="text"
        size="30"
        value="Please check your data before submission"
        readonly
      /><br /><br />
      <input type="submit" value="log in" />
    </form>
  </body>
</html>
