<html>
  <head>
    <title>Form Validation</title>

  </head>
  <body>
    <div class="container">
      <h2>Register</h2>

      <form id="form">
        <input type="text" id="username" placeholder="Username" />

        <input type="text" id="email" placeholder="Email" />

      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
